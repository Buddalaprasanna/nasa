<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#245C3A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>FIELD SHIFT - Smart Farming. Better Seasons. Stronger Future.</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="../src/css/styles.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23245C3A'/><path d='M25 65C25 65 35 35 65 35C65 35 75 65 25 65Z' fill='%238DBF74'/></svg>" />
</head>
<body>

  <div class="device-wrapper">
    <!-- Quick Frame Controls for Prototype Preview -->
    <div class="device-toggle-bar">
      <span>🌾 FIELD SHIFT • Android App Preview</span>
      <button id="btn-toggle-device-mode">🖥️ Full Screen Mode</button>
    </div>

    <!-- Android Device Frame -->
    <div class="device-frame" id="phone-device-frame">
      <!-- Android Status Bar -->
      <div class="android-status-bar">
        <span>09:41</span>
        <div class="camera-punch-hole"></div>
        <div class="status-bar-icons">
          <span>📶</span>
          <span>5G</span>
          <span>🔋 92%</span>
        </div>
      </div>

      <!-- App Screen Scrollable Viewport -->
      <main class="app-screen-container">
        <!-- SCREEN 1: SPLASH SCREEN -->
        <section id="screen-splash" class="screen-view active"></section>

        <!-- SCREEN 2: LANGUAGE SELECTION -->
        <section id="screen-language" class="screen-view"></section>

        <!-- SCREEN 3: WELCOME SCREEN -->
        <section id="screen-welcome" class="screen-view"></section>

        <!-- SCREEN 4: FARMER AND FARM SETUP -->
        <section id="screen-setup" class="screen-view"></section>

        <!-- SCREEN 5: HOME DASHBOARD -->
        <section id="screen-home" class="screen-view"></section>

        <!-- SCREEN 6: WEATHER AND CLIMATE DASHBOARD -->
        <section id="screen-weather" class="screen-view"></section>

        <!-- SCREEN 7: AI CROP RECOMMENDATIONS -->
        <section id="screen-crops" class="screen-view"></section>

        <!-- SCREEN 8: CROP ROTATION PLANNER -->
        <section id="screen-rotation" class="screen-view"></section>

        <!-- SCREEN 9: CLIMATE ALERTS -->
        <section id="screen-alerts" class="screen-view"></section>

        <!-- SCREEN 10: CROP CALENDAR -->
        <section id="screen-calendar" class="screen-view"></section>

        <!-- SCREEN 11: VOICE ASSISTANT -->
        <section id="screen-voice" class="screen-view"></section>

        <!-- SCREEN 12: PROFILE AND SETTINGS -->
        <section id="screen-profile" class="screen-view"></section>
      </main>

      <!-- Floating Voice Assistance Mic (Accessible across screens) -->
      <button class="floating-voice-button" id="floating-voice-btn" title="Ask Field Shift Voice Assistant">
        🎙️
      </button>

      <!-- Android Bottom Navigation Bar (5 Items) -->
      <nav class="android-bottom-nav" id="bottom-nav">
        <button class="nav-item active" data-screen="home">
          <div class="nav-item-icon-wrapper">🏠</div>
          <span class="nav-item-label" data-i18n="navHome">Home</span>
        </button>

        <button class="nav-item" data-screen="weather">
          <div class="nav-item-icon-wrapper">🌦️</div>
          <span class="nav-item-label" data-i18n="navWeather">Weather</span>
        </button>

        <button class="nav-item" data-screen="crops">
          <div class="nav-item-icon-wrapper">🌱</div>
          <span class="nav-item-label" data-i18n="navCrops">Crops</span>
        </button>

        <button class="nav-item" data-screen="rotation">
          <div class="nav-item-icon-wrapper">🔄</div>
          <span class="nav-item-label" data-i18n="navPlans">Plans</span>
        </button>

        <button class="nav-item" data-screen="profile">
          <div class="nav-item-icon-wrapper">👤</div>
          <span class="nav-item-label" data-i18n="navProfile">Profile</span>
        </button>
      </nav>

      <!-- Dynamic Bottom Sheet Modal (For Crop Details, Audio Info, Explanations) -->
      <div class="app-modal-backdrop" id="app-modal-backdrop">
        <div class="app-modal-sheet" id="modal-dynamic-content">
          <!-- Injected dynamically -->
        </div>
      </div>

      <!-- Farmer Toast Alert Feedback -->
      <div class="farmer-toast" id="farmer-toast">
        <span id="toast-message-text">Notification</span>
      </div>
    </div>
  </div>

  <script type="module" src="../src/js/app.js"></script>
</body>
</html>
